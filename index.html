<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="websites-data.js"></script>
  <script src="app.js"></script>
  <script>
    window.WebsiteLanding.boot({
      id: "all-websites",
      storageKey: "all-websites:simple-v2",
      title: "All Websites",
      subtitle: "",
      footer: "A launch page for the Websites For Fun folder.",
      settingsTitle: "All Websites Settings",
      ambient: "",

      defaultDensity: "compact",

      showSettings: false,
      showCategories: false,

        { id: "arcade-day", label: "Day", swatch: "linear-gradient(135deg, #fefce8, #38bdf8, #f97316)" },
